name: Plus Mobile — فحص وبناء iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  API_BASE_URL: ${{ vars.PLUS_API_BASE_URL || 'https://plus-erp-api.vercel.app' }}

jobs:
  build-ios:
    name: بناء iOS (مكتبة غير موقّعة)
    runs-on: macos-14
    defaults:
      run:
        working-directory: plus-mobile

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plus-mobile/package-lock.json

      - name: تثبيت الحزم
        run: npm ci

      - name: بناء الواجهة واختيار iOS
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          npm run build:app
          npx cap add ios || true
          npx cap sync ios

      - name: تثبيت CocoaPods
        run: |
          cd ios/App
          pod install

      - name: بناء التطبيق دون توقيع (يتحقق من سلامة المشروع)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: ملاحظة مهمة
        run: |
          echo "لبناء ملف IPA للتثبيت على أجهزة حقيقية أو للنشر على App Store تحتاج:"
          echo "1) جهاز Mac أو GitHub Runner من نوع macOS"
          echo "2) حساب Apple Developer (99 دولار/سنة)"
          echo "3) شهادة توزيع + Provisioning Profile + فريق تطوير"
