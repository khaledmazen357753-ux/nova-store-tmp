name: Plus Mobile — فحص وبناء iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  API_BASE_URL: ${{ vars.PLUS_API_BASE_URL || 'https://plus-erp-api.vercel.app' }}

jobs:
  build-ios:
    name: بناء iOS (مكتبة غير موقّعة)
    runs-on: macos-14
    defaults:
      run:
        working-directory: plus-mobile

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plus-mobile/package-lock.json

      - name: تثبيت الحزم
        run: npm ci

      - name: بناء الواجهة واختيار iOS
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          npm run build:app
          npx cap add ios || true
          npx cap sync ios

      - name: تثبيت CocoaPods
        run: |
          cd ios/App
          pod install

      - name: بناء التطبيق دون توقيع (يتحقق من سلامة المشروع)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: ملاحظة مهمة
        run: |
          echo "هذا الـ workflow يبني مشروع iOS ويتحقق من سلامته فقط (بدون توقيع)."
          echo ""
          echo "التطبيق لا يُنشر على أي متجر. للتثبيت على iPhone بشكل مباشر تحتاج:"
          echo "1) جهاز Mac (لأن بناء أي تطبيق iOS لا يتم إلا على macOS)"
          echo "2) شهادة توقيع + جهاز iPhone مسجَّل (أو حساب Apple Developer مجاني)"
          echo "3) أو استخدم طريقة (إضافة إلى الشاشة الرئيسية) من المتصفح — بدون أي توقيع"
          echo ""
          echo "أما أندرويد فلا يحتاج أي من ذلك: ملف APK واحد يكفي."
