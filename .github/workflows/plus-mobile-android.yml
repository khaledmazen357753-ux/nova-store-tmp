name: Plus Mobile — بناء تطبيق أندرويد (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plus-mobile/**'
      - '.github/workflows/plus-mobile-android.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  API_BASE_URL: ${{ vars.PLUS_API_BASE_URL || 'https://plus-erp-api.vercel.app' }}

jobs:
  build-apk:
    name: بناء APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plus-mobile

    steps:
      - name: سحب الكود
        uses: actions/checkout@v5

      - name: تهيئة Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plus-mobile/package-lock.json

      # Gradle 8.2.1 / AGP 8.2.1 لا يعملان على Java 21 → نستخدم Java 17
      - name: تهيئة Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # صور GitHub ubuntu-latest تحتوي Android SDK مثبّتاً مسبقاً.
      # نتحقق من وجود منصة 34 ونثبّتها فقط لو ناقصة.
      - name: التحقق من Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          fi
          ls "$SDK/platforms"

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنواع (TypeScript)
        run: npx tsc -b

      - name: بناء الواجهة المضمّنة
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: npm run build:app

      - name: مزامنة مشروع أندرويد
        run: npx cap sync android

      - name: التحقق من تضمين الواجهة داخل التطبيق
        run: |
          test -f android/app/src/main/assets/public/index.html
          du -h android/app/src/main/assets/public/index.html
          echo "تم تضمين الواجهة داخل التطبيق ✔"

      - name: بناء APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: تجهيز ملف APK للتنزيل
        run: |
          set -e
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/plus-mobile.apk
          ls -lh artifacts

      - name: رفع الـ APK كأثر قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: plus-mobile-apk
          path: plus-mobile/artifacts/plus-mobile.apk
          if-no-files-found: error
          retention-days: 90

      - name: نتيجة البناء
        if: always()
        run: |
          echo "### المحاسبي Plus" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**الحالة:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "رابط الخادم المضمّن: \`$API_BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "نزّل الأثر **plus-mobile-apk** من أسفل صفحة التشغيل، فك الضغط ثم ثبّت \`plus-mobile.apk\` على الهاتف مباشرة — بدون أي متجر." >> "$GITHUB_STEP_SUMMARY"
