name: Plus Mobile — بناء تطبيق أندرويد (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plus-mobile/**'
      - '.github/workflows/plus-mobile-android.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  API_BASE_URL: ${{ vars.PLUS_API_BASE_URL || 'https://plus-erp-api.vercel.app' }}

jobs:
  build-apk:
    name: بناء APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plus-mobile

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plus-mobile/package-lock.json

      - name: تهيئة Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تهيئة Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت الحزم
        run: npm ci

      - name: بناء الواجهة المضمّنة
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}
        run: npm run build:app

      - name: مزامنة مشروع أندرويد
        run: npx cap sync android

      - name: إضافة صلاحية الشبكة والتحقق من الملفات
        run: |
          test -f android/app/src/main/assets/public/index.html
          echo "تم تضمين الواجهة داخل التطبيق ✔"

      - name: بناء APK (Debug موقّع)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: نسخ ملف APK
        run: |
          mkdir -p ../artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk ../artifacts/plus-mobile.apk
          ls -lh ../artifacts

      - name: رفع الـ APK كأثر قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: plus-mobile-apk
          path: plus-mobile/artifacts/plus-mobile.apk
          retention-days: 90
